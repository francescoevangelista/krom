<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>KROM, indicizza le immagini</title>
<style>
  :root{--blue:#0000A5;--off:#F8FAFA;--ink:#060808;--red:#CF3B16}
  *{box-sizing:border-box}
  body{margin:0;background:#EEF0F1;color:var(--ink);font-family:Archivo,Arial,sans-serif;font-size:15px}
  header{padding:12px 16px;background:var(--off);border-bottom:1px solid rgba(0,0,0,.12);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header b{font-family:Menlo,monospace;font-weight:500}
  .btn{font:600 13px Archivo,Arial,sans-serif;color:var(--blue);background:var(--off);border:1px solid var(--blue);padding:9px 14px;border-radius:999px;cursor:pointer}
  .btn.p{background:var(--blue);color:var(--off)}
  main{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;min-height:calc(100vh - 60px)}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .pic{background:#fff;display:flex;align-items:center;justify-content:center;min-height:50vh;border:1px solid rgba(0,0,0,.1)}
  .pic img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;display:block}
  .side{display:flex;flex-direction:column;gap:10px}
  .themes{display:grid;grid-template-columns:1fr;gap:6px}
  .themes button{text-align:left;padding:10px 12px;border:1px solid rgba(0,0,0,.2);background:var(--off);border-radius:8px;cursor:pointer;font:14px Archivo,Arial,sans-serif;line-height:1.3}
  .themes button.on{background:var(--blue);color:var(--off);border-color:var(--blue)}
  .themes button.x{border-color:var(--red);color:var(--red)}
  .themes button.x.on{background:var(--red);color:#fff}
  .themes button kbd{display:inline-block;min-width:22px;text-align:center;font:600 12px Menlo,monospace;border:1px solid currentColor;border-radius:4px;margin-right:8px;padding:1px 4px}
  textarea{width:100%;min-height:90px;padding:10px;font:15px Archivo,Arial,sans-serif;border:1px solid rgba(0,0,0,.2);border-radius:8px;resize:vertical}
  .nav{display:flex;gap:8px}
  .nav .btn{flex:1}
  .stat{font:13px Menlo,monospace;color:var(--blue)}
  .help{font-size:13px;line-height:1.45;color:#333;background:var(--off);padding:10px 12px;border-radius:8px}
</style>
</head>
<body>
<header>
  <b id="pos">0 / 0</b>
  <span class="stat" id="done">0 indicizzate, 0 scartate</span>
  <span style="flex:1"></span>
  <button class="btn" id="reset" type="button">Azzera tutto</button>
  <button class="btn p" id="export" type="button">Scarica captions.js</button>
</header>
<main>
  <div class="pic"><img id="img" alt=""></div>
  <div class="side">
    <div class="help">Un tasto per il tema (1–9), <b>0</b> per scartare, frecce per muoverti. La nota è facoltativa e va in coda alla didascalia. Tutto si salva da solo nel browser: puoi chiudere e riprendere. Alla fine scarichi captions.js e lo sostituisci nella cartella del sito.</div>
    <div class="themes" id="themes"></div>
    <textarea id="note" placeholder="Nota su questa immagine (facoltativa): cosa mostra, a cosa serve."></textarea>
    <div class="nav"><button class="btn" id="prev" type="button">← Prima</button><button class="btn p" id="next" type="button">Dopo →</button></div>
  </div>
</main>

<script src="captions.js?v=idx"></script>
<script>
(() => {
  const THEMES = [
    ['1', 'foto_caos', 'La foto, il caos: la sesh, il cerchio, il trick appena atterrato e la faccia dopo. Il settanta per cento del feed.'],
    ['2', 'foto_quiete', 'La foto, la quiete: le mani, la concentrazione, un kendama fermo. Il trenta per cento che fa respirare il feed.'],
    ['3', 'dna', 'Il kendama DNA: faggio, tama blu con la banda chiara attorno al foro, lo scarabocchio inciso, il box logo inciso sulla base.'],
    ['4', 'scatole', 'Le sei scatole: un solo filo inciso attraversa i fronti, insieme formano il kendama e il nodo. La scatola è il biglietto.'],
    ['5', 'sito', 'Il sito: le persone prima dei prodotti, i prodotti in mano in posti veri, il blu solo come linea.'],
    ['6', 'card', 'Card e poster: campo blu, urlo in maiuscolo, il filo che entra nel testo, il box logo in basso.'],
    ['7', 'carta', 'La carta: fanzine, adesivi, fotocopia, due colori. La voce tribale.'],
    ['8', 'firme', 'Firme e studi: il filo che disegna, le varianti, i tentativi. Spiegano come si è arrivati alla direzione.'],
    ['9', 'feed', 'Il feed: come i cinque formati stanno insieme nella griglia dei nove.'],
    ['0', 'scarta', 'Scarta: non entra nel sito.'],
  ];
  const KEY = 'krom_idx_v1';
  let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) {}
  const imgs = []; let i = 0;
  const $ = id => document.getElementById(id);
  const th = $('themes');
  THEMES.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.dataset.id = t[1]; if (t[1] === 'scarta') b.className = 'x'; b.innerHTML = '<kbd>' + t[0] + '</kbd>' + t[2]; b.onclick = () => setTheme(t[1]); th.appendChild(b); });

  function save() { localStorage.setItem(KEY, JSON.stringify(data)); stats(); }
  function cur() { return imgs[i]; }
  function rec() { const k = cur(); if (!data[k]) data[k] = { theme: '', note: '' }; return data[k]; }
  function setTheme(id) { const r = rec(); r.theme = r.theme === id ? '' : id; save(); paint(); }
  function paint() {
    if (!imgs.length) return;
    $('img').src = 'img/flow/' + cur().slice(4) + '.jpg';
    $('pos').textContent = (i + 1) + ' / ' + imgs.length + '   ' + cur();
    const r = data[cur()] || { theme: '', note: '' };
    th.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === r.theme));
    $('note').value = r.note || '';
  }
  function stats() { const v = Object.values(data); $('done').textContent = v.filter(x => x.theme && x.theme !== 'scarta').length + ' indicizzate, ' + v.filter(x => x.theme === 'scarta').length + ' scartate'; }
  $('note').addEventListener('input', () => { rec().note = $('note').value; save(); });
  $('prev').onclick = () => { i = (i - 1 + imgs.length) % imgs.length; paint(); };
  $('next').onclick = () => { i = (i + 1) % imgs.length; paint(); };
  $('reset').onclick = () => { if (confirm('Azzero tutte le didascalie salvate?')) { data = {}; save(); paint(); } };
  addEventListener('keydown', e => {
    if (e.target === $('note')) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('note').blur(); } return; }
    const t = THEMES.find(x => x[0] === e.key); if (t) { setTheme(t[1]); return; }
    if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click();
  });

  $('export').onclick = () => {
    const C = Object.assign({}, window.CAPTIONS || {});
    const SKIP = [];
    imgs.forEach(k => { const r = data[k]; if (!r || !r.theme) return; if (r.theme === 'scarta') { SKIP.push(k); return; } const t = THEMES.find(x => x[1] === r.theme); C[k] = t[2] + (r.note ? ' ' + r.note.trim() : ''); });
    const esc = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ') + "'";
    let out = '// captions.js generato da indicizza.html\n';
    out += 'window.FIXED = ' + JSON.stringify(window.FIXED || []) + ';\n';
    out += "window.DEFAULT_CAPTION = '';\n";
    out += 'window.RANGES = [];\n';
    out += 'window.SKIP = ' + JSON.stringify(SKIP) + ';\n';
    out += 'window.VIDEOS = ' + JSON.stringify(window.VIDEOS || []) + ';\n';
    out += 'window.CAPTIONS = {\n' + Object.keys(C).map(k => '  ' + JSON.stringify(k) + ': ' + esc(C[k])).join(',\n') + '\n};\n';
    out += 'window.TEXTS = ' + JSON.stringify(window.TEXTS || [], null, 2) + ';\n';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/javascript' })); a.download = 'captions.js'; a.click();
  };

  (async () => {
    for (let n = 1; n <= 400; n++) {
      const k = String(n).padStart(3, '0');
      const ok = await new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = 'img/flow/' + k + '.jpg'; });
      if (!ok) { if (n > 3) break; else continue; }
      imgs.push('flow' + k);
    }
    stats(); paint();
  })();
})();
</script>
</body>
</html>
